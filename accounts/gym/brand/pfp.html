<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1080px;overflow:hidden}
body{background:var(--bg)}
.ring{position:absolute;inset:60px;border-radius:50%;background:var(--disc)}
</style><script src="mascot.js"></script></head><body><div class="ring"></div><script>
window.make=function(o){
  document.documentElement.style.setProperty('--bg',o.bg);document.documentElement.style.setProperty('--disc',o.disc);
  const m=createMascot(document.body); if(!m.el.parentNode) document.body.appendChild(m.el);
  const w=640; m.draw(0.892,{x:(1080-w)/2-10,y:o.y||170,w,mood:o.mood,look:0,enter:1,seed:1.5});
  m.el.style.transform='none';
  const svg=m.el.querySelector('svg'), NS="http://www.w3.org/2000/svg";
  const add=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e};
  if(o.kind==='gym'){
  add('rect',{x:22,y:30,width:156,height:22,rx:6,fill:o.band,stroke:'#1C27A8','stroke-width':5});
  add('rect',{x:22,y:37,width:156,height:5,fill:'#fff',opacity:.55});
  const g=add('g',{transform:'rotate(-25 214 198)'});
  add('rect',{x:186,y:192,width:58,height:12,rx:6,fill:'#9AA0B4',stroke:'#10121C','stroke-width':4},g);
  for(const x of [176,240]){add('rect',{x:x-8,y:170,width:24,height:56,rx:8,fill:'#2A2D38',stroke:'#10121C','stroke-width':5},g);
    add('rect',{x:x-2,y:176,width:6,height:44,rx:3,fill:'#fff',opacity:.18},g);}
  add('circle',{cx:214,cy:198,r:13,fill:'#FFE14A',stroke:'#1C27A8','stroke-width':5},g);
  } else if(o.kind==='kitchen'){
  // chef hat
  const hat=add('g',{transform:'translate(100 30) scale(1.3) translate(-100 -30)'});
  add('path',{d:'M44 30 Q30 -8 62 -12 Q74 -40 100 -34 Q126 -40 138 -12 Q170 -8 156 30 Z',fill:'#fff',stroke:'#10121C','stroke-width':5,'stroke-linejoin':'round'},hat);
  add('rect',{x:44,y:16,width:112,height:22,rx:4,fill:'#fff',stroke:'#10121C','stroke-width':5},hat);
  add('path',{d:'M78 -8 Q82 6 80 16 M122 -8 Q118 6 120 16',stroke:'#D7DAE4','stroke-width':4,fill:'none'},hat);
  // wooden spoon in right hand
  const g=add('g',{transform:'rotate(18 214 198)'});
  add('rect',{x:209,y:120,width:10,height:90,rx:5,fill:'#C98A4B',stroke:'#10121C','stroke-width':4},g);
  add('ellipse',{cx:214,cy:112,rx:16,ry:22,fill:'#D99A5B',stroke:'#10121C','stroke-width':4},g);
  add('circle',{cx:214,cy:198,r:13,fill:'#FFE14A',stroke:'#1C27A8','stroke-width':5},g);
  } else {
  // magnifying glass in right hand, lens over nothing (held up beside him)
  const g=add('g',{transform:'rotate(22 214 198)'});
  add('rect',{x:208,y:148,width:12,height:52,rx:6,fill:'#2A2D38',stroke:'#10121C','stroke-width':4},g);
  add('circle',{cx:214,cy:122,r:30,fill:'rgba(255,255,255,.28)',stroke:'#10121C','stroke-width':9},g);
  add('circle',{cx:214,cy:122,r:30,fill:'none',stroke:o.band,'stroke-width':5},g);
  add('path',{d:'M200 108 Q206 100 216 100',stroke:'#fff','stroke-width':5,fill:'none','stroke-linecap':'round'},g);
  add('circle',{cx:214,cy:198,r:13,fill:'#FFE14A',stroke:'#1C27A8','stroke-width':5},g);
  }
};
</script></body></html>
