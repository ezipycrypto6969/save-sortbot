<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1080px;overflow:hidden}
body{background:var(--bg)}
.ring{position:absolute;inset:60px;border-radius:50%;background:var(--disc)}
</style><script src="mascot.js"></script></head><body><div class="ring"></div><script>
window.make=function(o){
  document.documentElement.style.setProperty('--bg',o.bg);document.documentElement.style.setProperty('--disc',o.disc);
  const m=createMascot(document.body); if(!m.el.parentNode) document.body.appendChild(m.el);
  const w=640; m.draw(0.892,{x:(1080-w)/2-10,y:170,w,mood:o.mood,look:0,enter:1,seed:1.5});
  m.el.style.transform='none';
  const svg=m.el.querySelector('svg'), NS="http://www.w3.org/2000/svg";
  const add=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e};
  // sweatband across the forehead
  add('rect',{x:22,y:30,width:156,height:22,rx:6,fill:o.band,stroke:'#1C27A8','stroke-width':5});
  add('rect',{x:22,y:37,width:156,height:5,fill:'#fff',opacity:.55});
  // dumbbell in the right hand, raised
  const g=add('g',{transform:'rotate(-25 214 198)'});
  add('rect',{x:186,y:192,width:58,height:12,rx:6,fill:'#9AA0B4',stroke:'#10121C','stroke-width':4},g);
  for(const x of [176,240]){add('rect',{x:x-8,y:170,width:24,height:56,rx:8,fill:'#2A2D38',stroke:'#10121C','stroke-width':5},g);
    add('rect',{x:x-2,y:176,width:6,height:44,rx:3,fill:'#fff',opacity:.18},g);}
  add('circle',{cx:214,cy:198,r:13,fill:'#FFE14A',stroke:'#1C27A8','stroke-width':5},g);
};
</script></body></html>
