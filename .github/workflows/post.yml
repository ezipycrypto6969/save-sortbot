name: Post next reel (Instagram + YouTube + TikTok)
on:
  schedule:
    # 3 posts a day (Perth time, AWST = UTC+8): 3:00am, 7:00am and 7:30pm. Each run starts ~10 min early,
    # with a backup 40 min later in case GitHub skips or delays one. A reel is never posted twice.
    - cron: "47 18 * * *"   # 2:47am Perth
    - cron: "27 19 * * *"   # backup
    - cron: "47 22 * * *"   # 6:47am Perth
    - cron: "27 23 * * *"   # backup
    - cron: "17 11 * * *"   # 7:17pm Perth
    - cron: "57 11 * * *"   # backup
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: post-reel
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Publish the next due reel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PAUSED: ${{ vars.PAUSED }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python3 poster/post.py
      - name: Upload the same reel to YouTube Shorts
        if: always()
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          PAUSED: ${{ vars.PAUSED }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python3 poster/post_youtube.py
      - name: Post the same reel to TikTok
        if: always()
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: ${{ vars.UPLOAD_POST_USER }}
          TIKTOK_SOUND: ${{ vars.TIKTOK_SOUND }}
          TIKTOK_SOUND_COUNTRY: ${{ vars.TIKTOK_SOUND_COUNTRY }}
          PAUSED: ${{ vars.PAUSED }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python3 poster/post_tiktok.py
      - name: Save posted status
        if: always()
        run: |
          git config user.name "savesort-bot"
          git config user.email "savesort-bot@users.noreply.github.com"
          git add queue
          git diff --cached --quiet || (git commit -m "Posted reel" && git push)
