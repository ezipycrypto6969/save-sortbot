name: Post next reel (Instagram + YouTube)
on:
  schedule:
    # 12:20 and 19:20 Perth time (AWST = UTC+8). GitHub can start scheduled runs a few minutes late.
    - cron: "20 4 * * *"
    - cron: "20 11 * * *"
    # Backup runs 40 minutes later in case GitHub skips or delays one. Already-posted reels are never posted twice.
    - cron: "0 5 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: post-reel
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Publish the next due reel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PAUSED: ${{ vars.PAUSED }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python3 poster/post.py
      - name: Upload the same reel to YouTube Shorts
        if: always()
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          PAUSED: ${{ vars.PAUSED }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python3 poster/post_youtube.py
      - name: Save posted status
        if: always()
        run: |
          git config user.name "savesort-bot"
          git config user.email "savesort-bot@users.noreply.github.com"
          git add queue
          git diff --cached --quiet || (git commit -m "Posted reel" && git push)
