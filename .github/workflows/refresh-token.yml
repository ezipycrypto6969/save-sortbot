name: Refresh Instagram token
# Instagram long-lived tokens last 60 days. This renews it every Monday and saves the new one as the IG_ACCESS_TOKEN secret.
# Needs a GH_PAT secret: a fine-grained GitHub token for this repo with "Secrets: Read and write".
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch: {}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh and store token
        env:
          OLD: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(curl -sf "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${OLD}" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW"
          echo "Token refreshed."
