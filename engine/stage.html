<!doctype html>
<html><head><meta charset="utf-8">
<!-- SaveSort reel stage: 1080x1920. window.load(timeline) builds the scenes, window.render(t) draws frame t (seconds). -->
<style>
:root{--cobalt:#2C3BE3;--deep:#1C27A8;--ink:#10121C;--paper:#F3F4F8;--white:#fff;--go:#0F7F57;--gosoft:#DDF2E8;--warn:#E0480C;--warnsoft:#FCE6DA;--gate:#8A5A00;--gatesoft:#FBEFCF;--thin:#6B7083;--marker:#FFE14A;--muted:#585E71;--line:#D7DAE4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
body{font-family:"Inter Display","Inter","Archivo",sans-serif;-webkit-font-smoothing:antialiased}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.bg-cobalt{background:var(--cobalt);color:#fff}.bg-paper{background:var(--paper);color:var(--ink)}.bg-ink{background:var(--ink);color:#fff}
.big{position:absolute;left:90px;right:150px;font-weight:900;letter-spacing:-.03em;line-height:1.0}
.t,.head,.endline{white-space:nowrap}
.mark{background:var(--marker);color:var(--ink);padding:0 .1em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone;text-shadow:none}
.shadow{text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 40px rgba(0,0,0,.45)}
.mono{font-family:"DejaVu Sans Mono",monospace}
.tiles{position:absolute;left:-20px;right:-20px;top:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{aspect-ratio:9/14;border-radius:18px;position:relative}
.tile::after{content:"";position:absolute;right:20px;top:20px;width:30px;height:40px;background:rgba(255,255,255,.92);clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}
.tile:nth-child(5n+1){background:#F2B8A0}.tile:nth-child(5n+2){background:#9FB4F5}.tile:nth-child(5n+3){background:#B9E0C8}.tile:nth-child(5n+4){background:#E8C7F0}.tile:nth-child(5n+5){background:#F5DE93}
.tile b{position:absolute;left:18px;bottom:22px;right:18px;font-size:30px;font-weight:800;color:rgba(16,18,28,.75);line-height:1.1}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,18,28,.15),rgba(16,18,28,.72) 35%,rgba(16,18,28,.72) 65%,rgba(16,18,28,.2))}
.card{position:absolute;left:90px;right:150px;background:#fff;color:var(--ink);border-radius:36px;padding:56px;box-shadow:0 40px 80px -30px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:30px}
.label{font-family:"DejaVu Sans Mono",monospace;font-size:30px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.stamp{position:absolute;left:150px;border:12px solid currentColor;font-weight:900;font-size:110px;padding:8px 40px;border-radius:24px;letter-spacing:.02em;white-space:nowrap}
.step{display:flex;gap:30px;align-items:flex-start;background:#fff;border:3px solid var(--line);border-radius:28px;padding:30px 34px}
.step .n{flex:none;width:72px;height:72px;border-radius:50%;background:var(--cobalt);color:#fff;font-weight:900;font-size:40px;display:flex;align-items:center;justify-content:center}
.step p{font-size:46px;font-weight:800;line-height:1.15;letter-spacing:-.01em;padding-top:6px}
.check{display:flex;gap:28px;align-items:center;font-size:56px;font-weight:900;letter-spacing:-.02em}
.check .box{width:76px;height:76px;border-radius:20px;border:5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.check svg{width:48px;height:48px}
.logo{display:flex;align-items:center;gap:30px;font-weight:900;font-size:124px;letter-spacing:-.04em;color:#fff}
.logo svg{width:96px;height:114px}
.pill{align-self:flex-start;background:#fff;color:var(--deep);font-weight:900;font-size:64px;padding:30px 56px;border-radius:999px;box-shadow:0 12px 0 var(--deep);white-space:nowrap}
/* retention overlays: progress bar, open-loop hook banner, word-by-word captions, cut flash */
#prog{position:absolute;left:0;top:0;height:14px;width:0;background:var(--marker);z-index:20}
#hook{position:absolute;left:90px;top:96px;z-index:20;display:none;background:var(--warn);color:#fff;font-weight:900;font-size:46px;letter-spacing:.01em;padding:16px 30px;border-radius:999px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#caps{position:absolute;left:90px;right:150px;top:1395px;z-index:20;display:flex;justify-content:center}
#caps .chunk{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:0 18px;background:rgba(16,18,28,.88);border-radius:28px;padding:14px 30px;max-width:100%}
#caps .w{font-weight:900;font-size:62px;line-height:1.15;color:#fff;letter-spacing:-.01em}
#caps .w.on{color:var(--marker)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:30;pointer-events:none}
.count-n{font-size:520px;font-weight:900;letter-spacing:-.06em;line-height:.9;color:var(--marker)}
</style></head>
<body>
<div id="root"></div>
<div id="prog"></div><div id="hook"></div><div id="caps"></div><div id="flash"></div>
<script>
const LABELS=["AI agent","side hustle","this is the trick","$1000/day","comment GUIDE","Google Maps","Meta ads","study hack","breathwork","dropshipping","stop coping","secret mode","pressure washing","tax news","gym","Claude skills","cold email","SEO tip"];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rich=s=>esc(s).replace(/\*([^*]+)\*/g,'<span class="mark">$1</span>').replace(/\n/g,"<br>");
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const CHECK=c=>`<svg viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
let TL=null, SC=[];
function tiles(n){let h="";for(let i=0;i<n;i++)h+=`<div class="tile"><b>${LABELS[i%LABELS.length]}</b></div>`;return h;}
// shrink an element's font until it fits its box
function fit(el,maxW,maxH,start,min=40){let s=start;el.style.fontSize=s+"px";while(s>min&&(el.scrollWidth>maxW+2||el.scrollHeight>maxH)){s-=4;el.style.fontSize=s+"px";}}
function build(sc,i){
  const d=document.createElement("section");d.className="scene";d.id="s"+i;
  const bg=sc.bg||({hook:"ink",quote:"ink",title:"cobalt",steps:"paper",stat:"paper",checks:"paper",count:"ink",end:"cobalt"}[sc.type]);
  d.classList.add("bg-"+bg);
  if(sc.type==="hook"){
    d.innerHTML=`<div class="tiles">${tiles(48)}</div><div class="scrim"></div>`+
      sc.lines.map((l,k)=>`<div class="big shadow line" style="top:${560+k*190}px;color:#fff;white-space:nowrap">${rich(l)}</div>`).join("");
  } else if(sc.type==="quote"){
    d.innerHTML=(sc.heading?`<div class="big head" style="top:230px;color:#fff">${rich(sc.heading)}</div>`:"")+
      `<div class="card" style="top:${sc.heading?700:520}px"><div class="label">${esc(sc.label||"SAVED REEL SAYS")}</div><div class="q" style="font-weight:900;line-height:1.05;letter-spacing:-.02em">"${esc(sc.quote)}"</div>${sc.note?`<div class="note" style="font-size:42px;color:var(--muted);line-height:1.3;font-weight:500">${esc(sc.note)}</div>`:""}</div>`+
      (sc.stamp?`<div class="stamp" style="color:${sc.stampColor==="gate"?"#F2C45B":"var(--warn)"}">${esc(sc.stamp)}</div>`:"");
  } else if(sc.type==="title"){
    d.innerHTML=`<div class="big t" style="top:0;color:${bg==="paper"?"var(--ink)":"#fff"}">${rich(sc.text)}</div>`;
  } else if(sc.type==="steps"){
    d.innerHTML=`<div class="big head" style="top:200px;color:var(--ink)">${rich(sc.heading)}</div><div class="list" style="position:absolute;left:90px;right:150px;top:560px;display:flex;flex-direction:column;gap:24px">${sc.items.map((t,k)=>`<div class="step"><span class="n">${k+1}</span><p>${esc(t)}</p></div>`).join("")}</div>`;
  } else if(sc.type==="stat"){
    d.innerHTML=`<div class="big num" style="top:520px;font-size:420px;letter-spacing:-.05em;color:var(--${sc.color||"go"})">0</div><div class="big lab" style="top:1020px;color:var(--ink)">${rich(sc.label)}</div>`;
  } else if(sc.type==="checks"){
    d.innerHTML=`<div class="big head" style="top:230px;color:var(--ink)">${rich(sc.heading)}</div><div class="card" style="top:640px;gap:46px"><div class="label">${esc(sc.label||"")}</div>${sc.items.map((t,k)=>`<div class="check"><span class="box">${CHECK(k===sc.items.length-1&&sc.lastWarn?"#E0480C":"#0F7F57")}</span>${esc(t)}</div>`).join("")}</div>`;
  } else if(sc.type==="count"){
    d.innerHTML=`<div class="big cn" style="top:360px"><div class="count-n">#${esc(sc.n)}</div></div><div class="big lab" style="top:900px;color:#fff">${rich(sc.label||"")}</div>`;
  } else if(sc.type==="end"){
    d.innerHTML=`<div style="position:absolute;left:90px;right:150px;top:520px;display:flex;flex-direction:column;gap:70px"><div class="logo"><svg viewBox="0 0 22 26"><path d="M2 2h18v22l-9-6.5L2 24z" fill="#fff"/></svg>SaveSort</div><div class="endline" style="font-weight:900;letter-spacing:-.035em;line-height:1.02;color:#fff">${rich(sc.line||"Sort your saves.\n*Free.*")}</div><div class="pill">${esc(sc.pill||"Link in bio →")}</div></div><div class="loop" style="position:absolute;inset:0;opacity:0"><div class="tiles">${tiles(15)}</div></div>`;
  }
  document.getElementById("root").appendChild(d);
  d.style.display="block";
  const W=840;
  d.querySelectorAll(".line").forEach(e=>fit(e,W,200,170));
  const head=d.querySelector(".head"); if(head) fit(head,W,sc.type==="quote"?420:330,120);
  const q=d.querySelector(".q"); if(q){const card=q.parentElement; let s=76; q.style.fontSize=s+"px"; while(s>44&&card.scrollHeight>(sc.heading?720:900)){s-=4;q.style.fontSize=s+"px";}}
  const t=d.querySelector(".t"); if(t){fit(t,W,1100,150); t.style.top=Math.round((1600-t.scrollHeight)/2+40)+"px";}
  const list=d.querySelector(".list"); if(list){let s=46; while(s>32&&list.scrollHeight>1000){s-=2;list.querySelectorAll(".step p").forEach(p=>p.style.fontSize=s+"px");}}
  const lab=d.querySelector(".lab"); if(lab) fit(lab,W,300,96);
  const el=d.querySelector(".endline"); if(el) fit(el,W,260,110);
  const card=d.querySelector(".card"); const st=d.querySelector(".stamp");
  if(st&&card){st.style.top=(card.offsetTop+card.offsetHeight+70)+"px";}
  d.style.display="none";
  return d;
}
window.load=function(tl){TL=tl;document.getElementById("root").innerHTML="";SC=tl.scenes.map(build);};
function pop(el,t0,t,dur=0.22,from=1.35,origin="left center"){const p=(t-t0)/dur;el.style.opacity=p<0?0:1;el.style.transform=`scale(${p<0?from:from+(1-from)*back(p)})`;el.style.transformOrigin=origin;}
window.render=function(t){
  TL.scenes.forEach((sc,i)=>{
    const d=SC[i]; const on=t>=sc.start&&(t<sc.end||(i===TL.scenes.length-1&&t<=TL.dur));
    d.style.display=on?"block":"none"; if(!on)return;
    const lt=t-sc.start; const p0=lt/0.16; const drift=1+0.035*clamp(lt/Math.max(0.5,sc.end-sc.start));  // slow push-in so the frame never sits still
    d.style.transform=`scale(${(p0<1?1.07-0.07*ease(p0):1)*drift})`;
    if(sc.type==="hook"){
      const tl=d.querySelector(".tiles"); tl.style.transform=`translateY(${-((lt*(sc.slow?420:1500))%2400)}px)`;
      if(sc.grey) tl.style.filter=`grayscale(${ease(lt/0.6)})`;
      d.querySelectorAll(".line").forEach((e,k)=>pop(e,0.12+k*0.38,lt,0.24,k===d.querySelectorAll(".line").length-1?1.6:1.35));
    } else if(sc.type==="quote"){
      const card=d.querySelector(".card"); const c=ease((lt-0.05)/0.35); card.style.opacity=c; card.style.transform=`scale(${0.85+0.15*c})`;
      const h=d.querySelector(".head"); if(h) pop(h,0.0,lt,0.2,1.2);
      const st=d.querySelector(".stamp"); if(st){const p=(lt-sc.stampAt)/0.18; st.style.opacity=p<0?0:1; st.style.transform=`rotate(-8deg) scale(${p<0?2.4:2.4-1.4*ease(p)})`;
        if(lt>sc.stampAt+0.18&&lt<sc.stampAt+0.38){const s=Math.sin(t*120)*10; d.style.transform+=` translate(${s}px,${s/2}px)`;}}
    } else if(sc.type==="title"){ pop(d.querySelector(".t"),0.08,lt,0.24,1.25); }
    else if(sc.type==="steps"){
      pop(d.querySelector(".head"),0.05,lt,0.2,1.2);
      [...d.querySelectorAll(".step")].forEach((r,k)=>{const at=sc.itemTimes[k]-sc.start;const p=(lt-at)/0.28;r.style.opacity=p<0?0:1;r.style.transform=`translateY(${p<0?60:60*(1-ease(p))}px)`;});
    } else if(sc.type==="stat"){
      d.querySelector(".num").textContent=(sc.prefix||"")+Math.round(sc.value*ease((lt-0.1)/1.0))+(sc.suffix||"");
      pop(d.querySelector(".lab"),0.3,lt,0.22,1.2);
    } else if(sc.type==="checks"){
      pop(d.querySelector(".head"),0.05,lt,0.2,1.2);
      [...d.querySelectorAll(".check")].forEach((el,k)=>{const at=sc.itemTimes[k]-sc.start;const p=(lt-at)/0.2;el.style.opacity=p<0?0.25:1;const sv=el.querySelector("svg");sv.style.opacity=p<0?0:1;sv.style.transform=`scale(${p<0?0:back(p)})`;el.querySelector(".box").style.borderColor=p<0?"#D7DAE4":(k===sc.items.length-1&&sc.lastWarn?"#E0480C":"#0F7F57");});
    } else if(sc.type==="count"){
      pop(d.querySelector(".cn"),0.0,lt,0.22,2.2); pop(d.querySelector(".lab"),0.3,lt,0.22,1.25);
    } else if(sc.type==="end"){
      pop(d.querySelector(".logo"),0.05,lt,0.25,1.3);
      const pill=d.querySelector(".pill"); const q=(lt-0.45)/0.25; pill.style.transform=`scale(${q<0?0:back(q)})`; pill.style.transformOrigin="left center";
      d.querySelector(".loop").style.opacity=clamp((t-(TL.dur-0.35))/0.33);
    }
  });
  // progress bar (shows the video is short), cut flash, open-loop banner, captions
  const fx=TL.fx||{};
  const prog=document.getElementById("prog"); prog.style.display=fx.progress===false?"none":"block"; prog.style.width=(1080*clamp(t/TL.dur))+"px";
  let flash=0; TL.scenes.forEach((sc,i)=>{ if(i>0){const p=(t-sc.start)/0.1; if(p>=0&&p<1) flash=Math.max(flash,0.55*(1-p));} });
  document.getElementById("flash").style.opacity=fx.flash===false?0:flash;
  const hk=document.getElementById("hook");
  if(fx.hook&&t>=0.15&&t<(fx.hookUntil??TL.dur)){hk.style.display="block"; hk.textContent=fx.hook; const p=(t-0.15)/0.2; hk.style.transform=`scale(${p<1?0.6+0.4*back(p):1+0.03*Math.sin(t*6)})`; hk.style.transformOrigin="left center";}
  else hk.style.display="none";
  const caps=document.getElementById("caps"); const ch=(TL.caps||[]).find(c=>t>=c.t0&&t<c.t1);
  if(ch&&fx.captions!==false){
    caps.style.display="flex";
    if(caps.dataset.k!==String(ch.t0)){caps.dataset.k=String(ch.t0); caps.innerHTML=`<div class="chunk">${ch.words.map(w=>`<span class="w">${esc(w.w)}</span>`).join("")}</div>`;}
    [...caps.querySelectorAll(".w")].forEach((el,k)=>el.classList.toggle("on",t>=ch.words[k].t0));
    const p=(t-ch.t0)/0.12; caps.firstChild.style.transform=`scale(${p<1?0.85+0.15*ease(p):1})`;
  } else caps.style.display="none";
};
</script>
</body></html>
